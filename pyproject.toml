[project]
name = "pyrojewel-claude-code"
version = "0.1.0"
description = "Personal Claude Code + Codex configuration repository"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
