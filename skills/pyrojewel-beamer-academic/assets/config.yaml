# ============================================================
# pyrojewel-beamer-academic  —  Presentation Config
# ============================================================
# Fill these values before generating the .tex file.
# The compile script reads this for metadata injection.

# ---------- Identity ----------
full_title:   "Untitled Presentation"
short_title:  "Untitled"
author:       "Author"
institute:    "北京邮电大学 电子工程学院"
department:   "Department"
date:         "\\today"
supervisor:   ""
major:        ""

# ---------- Seals (校徽) ----------
# 方形校徽：\setseal{filename}
# 默认：北邮彩色校名校徽（横版，封面用）
seal_image: "北邮校名校徽编排 横版中英文.png"
# 横版校徽校名合图：\sethorizseal{filename}
# 默认：北邮白字横版 logo（headline 用）
horiz_seal_image: "bupt-logo-white.png"

# ---------- Layout ----------
aspect_ratio: "169"        # 169 (16:9) or 43 (4:3)
font_size:    "10pt"        # 10pt, 11pt, 12pt

# ---------- CJK Font Platform ----------
# Set to "auto" for compile-time detection, or force "macos"/"linux".
cjk_font_platform: "auto"

# ---------- Figure Paths ----------
# Colon-separated list; the tex header \graphicspath will use these.
figure_paths:
  - "materials/figures/"
  - "./"

# ---------- Output Path ----------
output:
  # Precedence: explicit user path > obsidian weekly > source-file directory fallback
  # When "default", uses OBSIDIAN_VAULT_ROOT-based weekly meeting folder
  path: "default"
  # Relative path inside OBSIDIAN_VAULT_ROOT for weekly meeting folders
  weekly_meeting_rel: "weekly"
  # Weekly subfolder format: {YYYY}_W{WW}/ using ISO week (underscore separator)
  weekly_format: "%G_W%V"
  # Fallback target when OBSIDIAN_VAULT_ROOT is not set
  fallback_dir: "source"

# ---------- Darwin Skill Metadata ----------
darwin:
  version: "3.1"
  baseline_score: 9.2       # From defense-v2 (2026-06-03)
  last_tested: "2026-07-02" # ISO date — v3.1 多样性排版命令已编译验证
  failure_modes:
    - id: FM-001
      mode: "CJK blank output"
      cause: "ctex package + Noto Sans CJK SC (TTC) on Linux/XeLaTeX"
      mitigation: "Use xeCJK + AR PL UMing CN; compile.sh auto-detects platform"
    - id: FM-002
      mode: "Missing figures"
      cause: "graphicspath mismatch or figures not copied"
      mitigation: "compile.sh copies theme; user must copy figures to materials/figures/"
    - id: FM-003
      mode: "Font not found"
      cause: "AR PL UMing CN not installed"
      mitigation: "apt install fonts-arphic-uming fonts-droid-fallback"
  blacklist:
    - "ctex package with XeLaTeX on Linux"
    - "Noto Sans CJK SC font specification in .tex"
    - "Swiss accented slides (\\accentslide, \\darkslide)"
    - "KPI cards (\\kpinumber, \\swisskpi)"
    - "Rounded corners on keybox (use 0pt)"
    - "English thank-you text on closing slide"
  checkpoints:
    - id: CP-001
      name: "compile-clean"
      description: "xelatex ×2 completes with 0 errors"
      status: pass
    - id: CP-002
      name: "cjk-visible"
      description: "All Chinese characters render (no blank glyphs)"
      status: pass
    - id: CP-003
      name: "no-overfull-vbox"
      description: "No Overfull \\vbox warnings"
      status: pass
    - id: CP-004
      name: "defense-cover-correct"
      description: "\\defensecover used (not \\academiccover)"
      status: pass
    - id: CP-005
      name: "chinese-thanks"
      description: "Closing slide uses Chinese thank-you text"
      status: pass