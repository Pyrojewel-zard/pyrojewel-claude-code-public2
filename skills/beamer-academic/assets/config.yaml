# Beamer Academic 配置文件
# 用户只需修改此文件即可定制自己的学术报告主题

# ============================================================
# 学校/机构信息
# ============================================================
institution:
  name: "XX大学"              # 显示在 footline 和封面
  department: "XX学院"        # 院系名称
  logo: ""                    # logo 文件名（放在项目目录下，留空不显示）
  gate_image: ""              # 致谢页的校门/标志建筑图（留空则用纯文字致谢页）

# ============================================================
# 配色方案
# ============================================================
# 预设可选: blue | red | green | purple | teal
color_scheme: "blue"

# 自定义配色（设置后 color_scheme 失效）:
# custom_color:
#   r: 26
#   g: 58
#   b: 92

# ============================================================
# 报告类型
# ============================================================
# 可选: defense (答辩) | proposal (开题) | conference (会议报告) |
#       paper-reading (单篇论文组会) | reproduction (论文算法复现) |
#       implementation-analysis (代码实现与结果分析)
report_type: "defense"

# ============================================================
# 答辩/报告信息（留空则从论文自动提取）
# ============================================================
presentation:
  title: ""                   # 论文/报告标题
  paper_meta: ""              # 会议/年份｜论文主题｜作者/课题组，例如 TMTT 2026｜噪声消除 LNA｜某组
  author: ""                  # 报告人姓名
  supervisor: ""              # 导师姓名+职称（开题/答辩需要）
  major: ""                   # 专业名称（开题/答辩需要）
  date: ""                    # 报告日期（如 "2026年6月"）

# ============================================================
# 生成参数
# ============================================================
generation:
  target_pages: 40            # 目标页数（paper-reading 忽略此值，按单篇最多4页）
  language: "zh"              # zh | en | bilingual
  time_limit: 20              # 报告时间（分钟），影响每页文字量
  aspect_ratio: "43"          # 43 (4:3) | 169 (16:9)
  font_size: "10pt"           # 10pt | 11pt | 12pt

# ============================================================
# ============================================================
# 单篇论文阅读模式（仅 report_type: paper-reading 使用）
# ============================================================
paper_reading:
  max_pages_per_paper: 4      # 单篇论文内容页硬上限；共享封面不计入论文单元
  plan_file: "outline.md"     # 先生成并确认 Markdown，再允许生成 .tex
  require_plan_approval: true
  include_toc: false          # 单篇论文默认不加目录
  show_paper_meta_on_pages: true
  note_sources:               # 实际使用哪个就保留哪个，不要重复生成同一篇笔记
    - provided-note
    - ljg-paper
    - ljg-read
    - ljg-qa
    - ljg-read
  default_roles:
    - overview
    - theory-figure
    - evidence
    - discussion
  inputs:
    original_paper: ""        # PDF / DOCX / TEX 路径
    reading_note: ""           # ljg-paper 笔记；含 ljg-read/ljg-qa 追加时仍是同一文件
  figure_dirs:
    paper_originals: "materials/figures/paper-originals"
    generated: "materials/figures/generated"

# ============================================================
# 实现状态汇报输入（由 implementation-report 生成）
# ============================================================
implementation_report:
  mode: "auto"               # auto | required | disabled
  bundle_dir: "materials/implementation-report"
  manifest: "materials/implementation-report/manifest.yaml"
  require_workflow_before_code: true
  workflow_layout: "workflow-overview"
  diagram_preference: "diagram-design"
  diagram_spec: "materials/implementation-report/diagram/diagram-spec.yaml"
  figure_manifest: "materials/implementation-report/figures/figure-manifest.yaml"
  layout_qa: "materials/implementation-report/qa/layout-review.md"

# ============================================================
# 论文复现模式（仅 report_type: reproduction 使用）
# ============================================================
reproduction:
  papers_per_unit: "2-5"      # 每篇论文的页数范围，按算法复杂度决定
  preferred_layout: "text-left-image-right"
  section_divider: "compact-white"
  require_paper_code_map: true
  require_reproduction_result: true
  required_roles:
    - overview
    - algorithm-derivation
    - paper-code-map
    - reproduction-result
  source_dirs:
    paper_originals: "materials/figures/paper-originals"
    generated: "materials/figures/generated"
    reproduction: "materials/figures/reproduction"

# ============================================================
# 编译设置
# ============================================================
compilation:
  engine: "xelatex"           # xelatex（中文必需）
  runs: 2                     # 编译次数（通常2次）
  # macOS 中文字体（默认）:
  cjk_main: "Songti SC"
  cjk_sans: "Heiti SC"
  cjk_mono: "STFangsong"
  # Linux 中文字体替代:
  # cjk_main: "Noto Serif CJK SC"
  # cjk_sans: "Noto Sans CJK SC"
  # cjk_mono: "Noto Sans Mono CJK SC"
